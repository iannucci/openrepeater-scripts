# /etc/systemd/system/svxlink.service.d/realtime.conf
#
# Drop-in override for the svxlink unit. Gives svxlink real-time scheduling
# so its single audio thread isn't preempted by other user-space work.
#
# The audio thread runs at SCHED_FIFO priority 50 — well above any
# desktop / network daemon, well below kernel watchdogs. mlockall is
# allowed via LimitMEMLOCK=infinity so svxlink (or a future RT-aware
# build of it) can pin its working set if it chooses.
#
# To remove: rm this file, then daemon-reload + restart svxlink.

[Service]
CPUSchedulingPolicy=fifo
CPUSchedulingPriority=50
Nice=-20
LimitRTPRIO=99
LimitMEMLOCK=infinity
IOSchedulingClass=realtime
IOSchedulingPriority=2
